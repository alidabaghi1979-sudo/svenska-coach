name: Daily Swedish lesson

on:
  schedule:
    # 00:17 UTC = 02:17 Stockholm (summer) / 01:17 (winter)
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: custom topic (leave empty for the next curriculum topic)"
        required: false
        default: ""
      grammar:
        description: "Grammar focus for the custom topic"
        required: false
        default: ""
      force:
        description: "Create a new lesson even if today's already exists"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit state.json / lessons.db back

concurrency:
  group: daily-lesson
  cancel-in-progress: false

defaults:
  run:
    working-directory: daily_lesson

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'azure' }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'swedencentral' }}
      TARGET_LEVEL: ${{ vars.TARGET_LEVEL || 'A2-B1' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
      ELEVENLABS_VOICE_NARRATOR: ${{ vars.ELEVENLABS_VOICE_NARRATOR }}
      ELEVENLABS_VOICE_MALE: ${{ vars.ELEVENLABS_VOICE_MALE }}
      ELEVENLABS_VOICE_FEMALE: ${{ vars.ELEVENLABS_VOICE_FEMALE }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      SVENSKA_SHEET_ID: ${{ secrets.SVENSKA_SHEET_ID }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: daily_lesson/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate lesson
        id: run
        env:
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_GRAMMAR: ${{ github.event.inputs.grammar }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          set +e
          if [ -n "$IN_TOPIC" ]; then
            python main.py run-topic "$IN_TOPIC" "${IN_GRAMMAR:-Valfri grammatik som passar ämnet}"
          elif [ "$IN_FORCE" = "true" ]; then
            python main.py run-daily --force
          else
            python main.py run-daily
          fi
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # rc=2 → lesson saved but audio failed: still commit, then fail the job at the end
          if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi
          exit 0

      - name: Upload MP3 + Anki files (kept 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: lesson-${{ github.run_number }}
          path: |
            daily_lesson/data/audio/*.mp3
            daily_lesson/data/exports/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit lesson data back to the repo
        run: |
          git config user.name  "svenska-bot"
          git config user.email "svenska-bot@users.noreply.github.com"
          git add data/state.json data/lessons.db data/lessons/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily lesson $(date -u +%F) [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Fail if audio generation failed
        if: steps.run.outputs.rc == '2'
        run: |
          echo "::warning::Lesson text saved, but audio failed. Re-run: python main.py synthesize --lesson-id <id>"
          exit 1
